openapi: 3.1.0
info:
  title: Booking Pro API
  version: "1.0.0"
  description: >
    The Booking Pro public API lets service businesses (salons, barbershops, spas,
    wellness studios) read and manage their availability, catalog, contacts,
    bookings, and stored value (gift cards, packages, memberships) programmatically.


    All requests are authenticated with a per-tenant API key and scoped to a single
    company. Every response is JSON. Monetary values are integers in **cents**
    (minor units) of the currency named by the object's `currency` field (uppercase
    ISO 4217). Each location has its own currency (`GET /locations`), so never
    assume USD.
  contact:
    name: Booking Pro Developer Support
    url: https://developers.bookingpro.ai
  license:
    name: Proprietary
servers:
  - url: https://api.bookingpro.ai/api/v1
    description: Production
tags:
  - name: General
    description: Meta endpoints (auth check, health).
  - name: Availability
    description: Open time slots a customer could book.
  - name: Catalog
    description: The services and locations a company offers.
  - name: Contacts
    description: The customer records (CRM) for a company.
  - name: Bookings
    description: Appointments. Create, read, cancel, and reschedule.
  - name: Gift Cards
    description: Stored-value gift cards.
  - name: Packages
    description: Prepaid session/credit packs.
  - name: Memberships
    description: Recurring membership plans.
  - name: Members
    description: Resolve and check in members (kiosk, turnstile, biometric device).
  - name: Classes
    description: Group classes (gyms and studios). The timetable, rosters, booking, cancelling and checking in.
  - name: Webhooks
    description: Outbound event subscriptions. Register an https URL and receive signed booking, payment and contact events.

security:
  - ApiKeyAuth: []

paths:
  /ping:
    get:
      operationId: ping
      tags: [General]
      summary: Verify a key
      description: >
        Returns the identity a key resolves to. Use it to confirm a key works and to
        see which company, scopes, environment, and locations it is bound to.
      responses:
        "200":
          description: The key is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id: { type: string, format: uuid }
                  environment: { type: string, enum: [live, test] }
                  scopes:
                    type: array
                    items: { type: string }
                  location_ids:
                    type: array
                    items: { type: string, format: uuid }
                    description: The locations this key may act on. Empty means all company locations.
                  request_id: { type: string }
              example:
                company_id: "3b1e...."
                environment: live
                scopes: ["read:catalog", "read:bookings", "write:bookings"]
                location_ids: ["a1c2...."]
                request_id: "req_9f2b7c"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /availability:
    get:
      operationId: getAvailability
      tags: [Availability]
      summary: List open slots
      description: >
        Returns bookable start times for a service at a location on a given date (or
        date range). Honors the location's business hours, staff schedules, existing
        bookings, classes, rooms, and booking rules, exactly like the public booking
        page. Each slot is sized for the staff member who would do it (their own
        duration, waiting period and cleanup time for the service).


        Without `technician_id`: at a location where every appointment needs a staff
        member, this is "any available": a time is listed when ANY staff member who
        performs the service is free, and the slot's `technician_id` is the staff
        member `POST /bookings` assigns when you book that start without naming one
        (the first free one in the location's booking priority order). At most 7 days
        per request in this mode. At a location that books appointments onto rooms,
        the slots come from the rooms and `technician_id` is null.


        Every `start` returned here is accepted by `POST /bookings` (unless someone
        books it first, which returns `409`).


        When the requested days have no open time, `next_available` is the first
        open slot after them (searched up to 60 days ahead, 28 in any-available
        mode), so you can offer the earliest time without a second call. It is
        also set to the first slot when there are slots. Pass `limit` to return
        only the earliest slots (for example `limit=20` for a text conversation).
      parameters:
        - name: location_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: service_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          description: Start date (YYYY-MM-DD), interpreted in the location's timezone.
          schema: { type: string, format: date }
        - name: days
          in: query
          required: false
          description: Number of days from `date` to include (1-31). Defaults to 1.
          schema: { type: integer, minimum: 1, maximum: 31, default: 1 }
        - name: technician_id
          in: query
          required: false
          description: Restrict to a specific staff member. Must be someone who performs the service at the location (otherwise `404 technician_not_found`).
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: Return at most this many slots, earliest first (1-500). Omit for every slot in the range.
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Available slots.
          content:
            application/json:
              schema:
                type: object
                properties:
                  location_id: { type: string, format: uuid }
                  service_id: { type: string, format: uuid }
                  timezone: { type: string, example: "America/New_York", description: "The location's timezone. Every `start`/`end` is an absolute UTC time; use this to say it in the location's local time." }
                  slots:
                    type: array
                    items: { $ref: "#/components/schemas/Slot" }
                  next_available:
                    nullable: true
                    description: The earliest open slot (the first of `slots`, or the first after the requested days when they have none). Null when nothing is open in the search window.
                    allOf:
                      - $ref: "#/components/schemas/Slot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The location, the service (`service_not_found`, also when it is not offered at the location), or the staff member (`technician_not_found`) does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /services:
    get:
      operationId: listServices
      tags: [Catalog]
      summary: List services
      description: >
        The bookable services offered, scoped to the key's locations: every active
        service assigned to each location and open for online booking, with that
        location's price and duration. Each location lists its own rows (the same
        service at two locations is two rows with two ids). The list is complete in
        one response (not paginated).
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: The services.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /services/{id}:
    get:
      operationId: getService
      tags: [Catalog]
      summary: Retrieve a service
      description: The same object `GET /services` returns. A service that list hides (deleted, inactive, not offered at its location, or closed to online booking) is a `404`.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /locations:
    get:
      operationId: listLocations
      tags: [Catalog]
      summary: List locations
      description: The locations this key may act on.
      responses:
        "200":
          description: Locations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Location" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contacts:
    get:
      operationId: listContacts
      tags: [Contacts]
      summary: List contacts
      description: Contacts are shared by every location of the company.
      parameters:
        - name: search
          in: query
          required: false
          description: Fuzzy match on name, phone, or email. A name also matches when written with or without accents ("jose" finds "José"); those contacts are listed after the exact-spelling matches.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Contact" }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createContact
      tags: [Contacts]
      summary: Create a contact
      description: >
        Creates a customer record. Phone numbers are normalized to E.164. If a
        contact with the same phone already exists at the location, the existing
        record is returned (idempotent on phone) rather than duplicated.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactCreate" }
      responses:
        "201":
          description: The created (or matched) contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [Contacts]
      summary: Retrieve a contact
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateContact
      tags: [Contacts]
      summary: Update a contact
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactUpdate" }
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /bookings:
    get:
      operationId: listBookings
      tags: [Bookings]
      summary: List bookings
      description: >
        Lists bookings, newest first by default. To find a client's appointments
        from what you know about them, pass `phone` and/or `email`: the client is
        matched the same way booking matches a contact (any stored phone format),
        and the response adds `contact_found` and `matched_contacts` (more than one
        person can share a phone). Each matched contact carries `client_status`:
        `returning` when they have a past visit (an appointment completed, checked in
        or passed), otherwise `new`. For a "what are my upcoming appointments" lookup use
        `from` = now, `order=asc` and `exclude_cancelled=true`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: phone
          in: query
          description: Only bookings of the contact(s) with this phone number (any format; at least 7 digits).
          schema: { type: string }
        - name: email
          in: query
          description: Only bookings of the contact(s) with this email (case-insensitive exact match).
          schema: { type: string }
        - name: exclude_cancelled
          in: query
          description: Leave out cancelled bookings.
          schema: { type: boolean, default: false }
        - name: order
          in: query
          description: Sort by start time, `desc` (newest first, the default) or `asc` (soonest first).
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: from
          in: query
          description: Include bookings starting on/after this date-time.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Include bookings starting before this date-time.
          schema: { type: string, format: date-time }
        - name: contact_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of bookings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Booking" }
                  next_cursor: { type: string, nullable: true }
                  contact_found: { type: boolean, description: "Only when `phone` or `email` was passed: whether any contact matched. False means this is a new client; `data` is then empty." }
                  matched_contacts:
                    type: array
                    description: Only when `phone` or `email` was passed. The contacts that matched.
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        first_name: { type: string, nullable: true }
                        last_name: { type: string, nullable: true }
                        phone: { type: string, nullable: true }
                        email: { type: string, nullable: true }
                        client_status: { type: string, enum: [new, returning], description: "`returning` when the client has a past visit (an appointment completed, checked in or passed), otherwise `new`." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createBooking
      tags: [Bookings]
      summary: Create a booking
      description: >
        Books an appointment. The start is re-checked exactly the way the public
        booking page re-checks it: the staff member's working hours, the location's
        hours, existing bookings, classes, rooms, and the location's booking rules
        (same day, how far ahead, minimum notice). The visit is sized for the staff
        member doing it (their own duration, waiting period and cleanup time for the
        service). A taken or closed time returns `409 slot_unavailable`; a broken
        booking rule returns `422 booking_rule_violation`.


        Without `technician_id`, at a location where every appointment needs a staff
        member, the first free staff member who performs the service (in the
        location's booking priority order) is assigned: the same person
        `GET /availability` named for that slot. At a location that books onto
        rooms, the appointment is booked onto a room with no staff member (the
        service must have a room there, else `422 service_not_bookable`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCreate" }
      responses:
        "201":
          description: The created booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [Bookings]
      summary: Retrieve a booking
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [Bookings]
      summary: Cancel a booking
      description: >
        Cancels the appointment the same way the dashboard does: it gets the
        business's Cancelled status, the customer and staff are notified, the
        calendar event is removed, and automations and webhooks
        (`booking.cancelled`) fire. Cancelling a booking that is already cancelled
        changes nothing and returns it.

        Money: anything the customer already paid toward the appointment (a
        deposit) becomes their store credit with the business. When the
        business's late-cancellation policy applies, the fee is taken from that
        deposit first (a $100 deposit with a $25 late fee leaves $75 of credit).
        Nothing is refunded to a card automatically; the business can refund the
        credit or waive the fee from the dashboard.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Optional cancellation reason (stored on the booking). }
      responses:
        "200":
          description: The cancelled booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /bookings/{id}/reschedule:
    post:
      operationId: rescheduleBooking
      tags: [Bookings]
      summary: Reschedule a booking
      description: >
        Moves a booking to a new start time (and optionally to another staff
        member). The new start is re-checked exactly like create: working and
        location hours, existing bookings, classes, rooms, and the booking rules.
        When `technician_id` names a different staff member, the visit is re-sized
        for that person (their own duration, waiting period and cleanup time for
        each service); each service keeps its quantity, price and room. A cancelled
        booking cannot be rescheduled (`409 booking_cancelled`); create a new one.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start]
              properties:
                start: { type: string, format: date-time, description: The new start. Use a start from `GET /availability`. }
                technician_id: { type: string, format: uuid, description: Move the booking to this staff member (must perform its services at the location). Omit to keep the current one. }
      responses:
        "200":
          description: The rescheduled booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /gift-cards:
    get:
      operationId: listGiftCards
      tags: [Gift Cards]
      summary: List gift cards
      description: >
        Gift cards issued at the key's locations (a location-limited key does not see
        cards of other locations, or cards that belong to no single location). Pass
        `location_id` to narrow to one of the key's locations.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of gift cards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GiftCard" }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /gift-cards/{id}:
    get:
      operationId: getGiftCard
      tags: [Gift Cards]
      summary: Retrieve a gift card
      description: >
        A gift card outside the key's locations answers `404`, exactly like one that does
        not exist (same rule as the list).
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The gift card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages:
    get:
      operationId: listPackages
      tags: [Packages]
      summary: List package templates
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Package templates offered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Package" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /memberships:
    get:
      operationId: listMembershipPlans
      tags: [Memberships]
      summary: List membership plans
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Membership plans offered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MembershipPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /contacts/{id}/memberships:
    get:
      operationId: listContactMemberships
      tags: [Memberships]
      summary: List a contact's memberships
      description: >
        The memberships a contact holds (as primary member or family member), with status
        and remaining credits. A location-limited key sees only memberships whose home
        location is one of its locations.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The contact's memberships.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContactMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /members/resolve:
    post:
      operationId: resolveMember
      tags: [Members]
      summary: Resolve a member and check eligibility
      description: >
        Given a credential (a member code or an RFID fob/card UID) and a location,
        returns the matching membership and whether the member is currently
        eligible to check in. Use this from a kiosk, turnstile, or a biometric
        device (map a face/fingerprint to the member's code, then call this) to
        decide whether to let someone in, without recording a visit. The answer runs
        every rule `POST /members/check-in` runs (membership active, facility plan,
        blackout window, location covered, home-location-only, the location's check-in
        blocks, credits, and the currency rule), so `valid_for_checkin: true` means the
        check-in will be accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, location_id]
              properties:
                identifier: { type: string, description: The member's code or fob/card UID. }
                location_id: { type: string, format: uuid }
      responses:
        "200":
          description: Resolution result (found may be false).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberResolveResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /members/check-in:
    post:
      operationId: checkInMember
      tags: [Members]
      summary: Check a member in
      description: >
        Records a facility check-in for a member. Provide either an `identifier`
        (member code or fob UID, which is resolved for you) or an explicit
        `membership_id` + `contact_id`. Enforces the same rules as the dashboard:
        membership active, plan allows facility access, the location is covered,
        cross-location rules, and available credits. Send an `Idempotency-Key` so
        a retry or a double-scan does not log two visits.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id]
              properties:
                location_id: { type: string, format: uuid }
                identifier: { type: string, description: Member code or fob UID (resolve for me). }
                membership_id: { type: string, format: uuid }
                contact_id: { type: string, format: uuid }
                method:
                  type: string
                  description: How the member was identified.
                  enum: [code, fob, qr, phone, email, device]
                  default: code
      responses:
        "201":
          description: Checked in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked_in: { type: boolean }
                  visit_id: { type: string, format: uuid, nullable: true }
                  remaining_credits: { type: integer, nullable: true, description: Null for unlimited plans. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            The check-in was denied (not eligible, no credits, wrong location, etc). The message
            says why. `currency_mismatch` means the membership is in another currency than this
            location (see CurrencyMismatch); do not retry it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /members/{id}/visits:
    get:
      operationId: listMemberVisits
      tags: [Members]
      summary: List a membership's check-ins
      description: >
        A location-limited key sees only memberships whose home location is one of its
        locations (another answers `404`), and only the check-ins made at its locations.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recent check-ins, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MemberVisit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /classes:
    get:
      operationId: listClasses
      tags: [Classes]
      summary: List classes (the timetable)
      description: >
        Group classes scheduled in a window (default: the next 7 days, at most 31).
        Each row carries how many spots are booked and how many are left. Only
        gyms and studios run classes; other businesses get an empty list.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Window start (ISO 8601). Defaults to now.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Window end (ISO 8601). Defaults to from + 7 days; at most 31 days after from.
        - name: service_id
          in: query
          schema: { type: string, format: uuid }
          description: Only classes of this service.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Classes in the window, earliest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ClassSession" }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /classes/{id}:
    get:
      operationId: getClass
      tags: [Classes]
      summary: Retrieve a class with its roster
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The class, who is booked (with what covers each spot) and the waitlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSessionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /classes/{id}/book:
    post:
      operationId: bookClass
      tags: [Classes]
      summary: Book a contact into a class
      description: >
        Reserves a spot on the roster. Nothing is charged: the spot records what will
        cover it at check-in (`membership`, `package`, `free_class`) or `none`. The
        class rules apply: capacity (409 `class_full`), signup cutoff / max per day /
        first-timers only (422 `booking_rule`), and, when the service requires a
        membership or package, entitlement (422 `entitlement_required`) unless
        `allow_without_entitlement` is true (a staff-style booking the desk charges
        at checkout). Send an `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id]
              properties:
                contact_id: { type: string, format: uuid }
                allow_without_entitlement: { type: boolean, default: false, description: Book even when no membership or package covers the class (charge at checkout). }
      responses:
        "201":
          description: The spot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSpot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The class is full (`class_full`). Members can join the waitlist from the customer app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: A class rule refused the booking (`booking_rule`, message says which) or nothing covers it (`entitlement_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /classes/{id}/cancel:
    post:
      operationId: cancelClassSpot
      tags: [Classes]
      summary: Cancel a contact's spot
      description: >
        Releases the contact's spot. Inside the location's cancellation window it is a
        late cancel (`late: true`) that still consumes the covering credit unless
        `excuse` is true. A freed spot is offered to the waitlist automatically.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id]
              properties:
                contact_id: { type: string, format: uuid }
                reason: { type: string }
                excuse: { type: boolean, default: false, description: Return the credit even on a late cancel. }
      responses:
        "200":
          description: The released spot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendee_id: { type: string, format: uuid }
                  class_id: { type: string, format: uuid }
                  contact_id: { type: string, format: uuid }
                  status: { type: string, enum: [cancelled, late_cancelled] }
                  late: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/CurrencyMismatch" }

  /classes/{id}/check-in:
    post:
      operationId: checkInClassSpot
      tags: [Classes]
      summary: Check a booked contact in
      description: >
        Marks the contact's spot checked in and consumes what covers it (a membership
        visit or a package credit). Honors the location's member check-in alert blocks
        (422 `checkin_blocked` with `reasons`; a manager overrides at the desk). Send an
        `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id]
              properties:
                contact_id: { type: string, format: uuid }
      responses:
        "201":
          description: Checked in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendee_id: { type: string, format: uuid }
                  class_id: { type: string, format: uuid }
                  contact_id: { type: string, format: uuid }
                  status: { type: string, enum: [checked_in] }
                  paid_by: { type: string, nullable: true, enum: [membership, package, order, free_class, none] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            The check-in was refused (`checkin_blocked` with `reasons`, or a rule such as a
            cancelled spot), or `currency_mismatch`: what covers the class is in another currency
            than this location (see CurrencyMismatch; do not retry).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhook endpoints
      description: >
        Returns the webhook endpoints registered for your account. The signing
        secret is never returned here; it is shown only once, when the endpoint is
        created (or its secret rotated). A location-limited key sees and manages only
        endpoints limited to its own locations (never an all-locations endpoint);
        any other endpoint answers `404` to it on every webhook route.
      responses:
        "200":
          description: Your webhook endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Register a webhook endpoint
      description: >
        Register an https URL to receive events. Booking Pro POSTs a JSON body for
        each subscribed event, signed with HMAC-SHA256 in the
        `X-BookingPro-Signature` header (`sha256=<hex>`) using the `secret`
        returned here. Verify every delivery by recomputing the HMAC of the raw
        request body with that secret. Each delivery also carries a unique
        `X-BookingPro-Event-Id` you can use to deduplicate. The `secret` is shown
        ONLY in this response. Subscribe to specific event types, or `"*"` for all.
        Send an `Idempotency-Key` so a retried create does not register twice.
        The body of every delivery is a `WebhookEvent`; payment events carry
        `amount_cents`, `tip_cents` and their `currency` (uppercase ISO 4217).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, event_types]
              properties:
                url: { type: string, format: uri, description: An https:// URL that will receive POSTed events. }
                event_types:
                  type: array
                  description: 'Events to receive, or ["*"] for all.'
                  items:
                    type: string
                    enum: [booking.created, booking.cancelled, booking.rescheduled, booking.completed, booking.no_show, booking.checked_in, booking.confirmed, payment.received, payment.refunded, contact.created, "*"]
                description: { type: string, nullable: true }
      responses:
        "201":
          description: The created endpoint, including the one-time signing secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /webhooks/{id}:
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Get a webhook endpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      description: Permanently removes the endpoint. Pending deliveries to it are dropped.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks/{id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Rotate a webhook's signing secret
      description: >
        Generates a new signing secret and returns it ONCE. Update your receiver to
        verify with the new secret. The old secret stops working immediately.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The endpoint with its new one-time secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List recent deliveries for a webhook
      description: >
        The delivery log for an endpoint: one row per event sent to it, with the
        delivery status, attempt count, last HTTP response status, and any error.
        Use it to debug a receiver that is not acknowledging events.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200":
          description: Recent deliveries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: >
        Send your API key as a bearer token: `Authorization: Bearer bp_sk_live_...`.
        Mint and revoke keys in your dashboard under Settings -> Developers.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: location_id
      in: query
      required: false
      description: Restrict to a single location. Must be one the key can access.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` from a previous page.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        A unique key you generate per logical create. Retrying with the same key
        returns the original result instead of creating a duplicate.
      schema: { type: string, maxLength: 255 }

  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: authentication
              code: invalid_api_key
              message: The API key provided is invalid or has been revoked.
              request_id: req_9f2b7c
    Forbidden:
      description: The key lacks the scope, or the target is outside the key's locations.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: permission
              code: insufficient_scope
              message: This key does not have the read:bookings scope.
              request_id: req_9f2b7c
    NotFound:
      description: The resource does not exist (or is not in this company).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >
        The requested time conflicts with an existing booking or block. For
        `slot_unavailable`, `error.alternatives` lists up to 3 of the next open
        slots after the requested time (same service and staff member), so you can
        offer them right away. Nothing was changed: a failed reschedule leaves the
        original appointment exactly as it was.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: conflict
              code: slot_unavailable
              message: That time is no longer available.
              alternatives:
                - start: "2026-10-20T15:00:00Z"
                  end: "2026-10-20T17:15:00Z"
                  technician_id: "3f1c2a9e-0b7d-4c55-9a1e-6d2f8b4c7a10"
                  technician_name: Jane Smith
              request_id: req_9f2b7c
    CurrencyMismatch:
      description: >
        `currency_mismatch` (type `invalid_request`): the business keeps locations that
        use different currencies completely separate, and this request would carry money
        or value between them (for example a membership or package bought in one currency,
        used at a location of another). The `message` says why in plain words, ready to
        show a person. It is a business rule, not a failure: do NOT retry it; the same
        request always gets the same answer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: invalid_request
              code: currency_mismatch
              message: This membership is in US dollars and this location sells in Mexican pesos. Memberships can only be used at locations that use the same currency.
              request_id: req_9f2b7c
    ServiceUnavailable:
      description: >
        A temporary failure reading the schedule or catalog. Nothing is wrong with
        the request; retry shortly (with the same `Idempotency-Key` for a create).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: server
              code: availability_unavailable
              message: Availability could not be loaded right now. Nothing is wrong with your request; please retry shortly.
              request_id: req_9f2b7c
    ValidationError:
      description: The request body or query failed validation (including an id that is not a UUID, `invalid_id` / `invalid_field`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: invalid_request
              code: missing_field
              message: first_name is required.
              param: first_name
              request_id: req_9f2b7c

  schemas:
    ClassSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        service_id: { type: string, format: uuid }
        service_name: { type: string, nullable: true }
        technician_id: { type: string, format: uuid, nullable: true }
        technician_name: { type: string, nullable: true, description: The trainer / instructor. }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        capacity: { type: integer, nullable: true, description: Null = unlimited. }
        booked: { type: integer, description: Spots held (booked or checked in). }
        spots_left: { type: integer, nullable: true }
        waiting: { type: integer, description: People on the waitlist. }
        status: { type: string, enum: [scheduled, cancelled, completed] }

    ClassSessionDetail:
      allOf:
        - $ref: "#/components/schemas/ClassSession"
        - type: object
          properties:
            roster:
              type: array
              items:
                type: object
                properties:
                  attendee_id: { type: string, format: uuid }
                  contact_id: { type: string, format: uuid }
                  status: { type: string, enum: [reserved, registered, checked_in, no_show, late_cancelled, cancelled] }
                  paid_by: { type: string, nullable: true, enum: [membership, package, order, free_class, none], description: What covers the spot (consumed at check-in). }
                  source: { type: string, enum: [staff, portal, kiosk, series, waitlist, import] }
                  booked_at: { type: string, format: date-time }
                  checked_in_at: { type: string, format: date-time, nullable: true }
                  cancelled_at: { type: string, format: date-time, nullable: true }
                  guest_of_contact_id: { type: string, format: uuid, nullable: true }
            waitlist:
              type: array
              items:
                type: object
                properties:
                  waitlist_id: { type: string, format: uuid }
                  contact_id: { type: string, format: uuid }
                  status: { type: string, enum: [waiting, offered] }
                  position: { type: integer }
                  offer_expires_at: { type: string, format: date-time, nullable: true }

    ClassSpot:
      type: object
      properties:
        attendee_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        status: { type: string, enum: [reserved, registered] }
        paid_by: { type: string, nullable: true, enum: [membership, package, order, free_class, none] }
        spots_left: { type: integer, nullable: true }
        already_booked: { type: boolean, description: True when the contact already held this spot (no change made). }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              enum: [invalid_request, authentication, permission, rate_limit, not_found, conflict, server]
            code: { type: string, description: A stable machine-readable code. }
            message: { type: string, description: A human-readable explanation. }
            param: { type: string, nullable: true, description: The offending field, when applicable. }
            alternatives:
              type: array
              description: "Only on `409 slot_unavailable`: up to 3 open slots after the requested time. Empty when none are open in the next two weeks."
              items: { $ref: "#/components/schemas/Slot" }
            request_id: { type: string, description: Quote this when contacting support. }

    Slot:
      type: object
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: "When the appointment would end: `start` plus the whole visit with this slot's staff member (their duration for the service, including any waiting period inside it)." }
        technician_id: { type: string, format: uuid, nullable: true, description: "The staff member this slot is with: the one you asked for, the one `POST /bookings` assigns in any-available mode, or null at a location that books onto rooms." }
        technician_name: { type: string, nullable: true, description: The staff member's name, for saying the slot to a person. }

    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string, example: "America/New_York" }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: The location phone number shown to customers. }
        currency: { type: string, example: "USD", description: "Uppercase ISO 4217 code of the currency this location sells in. Every price and balance at this location (services, packages, membership plans, gift cards) is in minor units of it. Supported: USD, MXN, JMD, TTD, BBD, BSD, KYD, DOP, AWG, XCG." }
        default_language: { type: string, enum: [en, es], example: "en", description: "The language this location messages its customers in when a contact has no language of their own (en = English, es = Spanish)." }

    Service:
      type: object
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        duration_minutes: { type: integer, description: "Full length of the appointment in minutes, from the start until the customer is done. For a service with a waiting period in the middle (for example hair color, where the product sets before the staff member returns), this includes the wait and the time after it: the work before the wait is `duration_minutes - wait_minutes - finish_minutes`. It does not include cleanup time after the customer leaves. A staff member can have their own length for a service; availability and bookings use theirs." }
        wait_minutes: { type: integer, description: "The waiting period inside the service, in minutes (0 = none). The staff member is free for someone else during it; the customer stays." }
        finish_minutes: { type: integer, description: "Work after the waiting period, in minutes. Always 0 when `wait_minutes` is 0." }
        client_stays_in_room: { type: boolean, description: "True when the customer keeps their room during the waiting period (nobody else is put in it). False when the room is freed during the wait, or the service has no wait." }
        price_cents: { type: integer, nullable: true, description: "This location's price in minor units (cents) of `currency`. Null when the price is set at checkout." }
        currency: { type: string, example: "USD", description: "Uppercase ISO 4217 code of the currency every `_cents` field on this object is in (minor units, 2 decimals). Each location has its own currency, so check it rather than assuming USD; a Mexican location is MXN." }

    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: E.164. }
        email: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ContactCreate:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string, description: Any format; normalized to E.164. }
        email: { type: string }

    ContactUpdate:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        email: { type: string }

    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid, nullable: true }
        service_id: { type: string, format: uuid, nullable: true }
        technician_id: { type: string, format: uuid, nullable: true, description: The staff member. Null for an appointment booked onto a room. }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: "End of the whole appointment. Set by the server from the staff member's full length for the service, including any waiting period inside the service." }
        status:
          type: string
          enum: [booked, confirmed, checked_in, completed, cancelled, no_show, passed]
          description: >
            What the appointment's status means, whatever the business calls it:
            `booked` (on the schedule; also any custom status with no special
            meaning), `confirmed` (the customer confirmed), `checked_in` (arrived),
            `completed`, `cancelled`, `no_show`, `passed` (the time has gone by with
            no outcome recorded). The business's own name for it is `status_name`.
        status_name: { type: string, nullable: true, description: "The status as the business names it (for example Booked, or a custom status like Waiting for Payment). For display; use `status` in code." }
        staff_busy:
          type: array
          description: >
            When the staff member is actually busy during the appointment. One block
            (start to end) for an ordinary appointment; for a service with a waiting
            period, the parts before and after the wait (the staff member is free in
            between). Empty when there is no staff member.
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
        source: { type: string, example: api }
        created_at: { type: string, format: date-time }
        slug: { type: string, nullable: true, description: "The booking's short public reference (used in the customer's manage-booking link)." }

    BookingCreate:
      type: object
      required: [location_id, service_id, start]
      properties:
        location_id: { type: string, format: uuid }
        service_id: { type: string, format: uuid, description: "The service as listed for this location (GET /services with location_id). Every location owns its own service rows and prices; if you pass the same service's id from another location, it resolves to this location's row, or returns service_not_found when the service is not offered here." }
        start: { type: string, format: date-time, description: "Start time, on a whole minute. Use a `start` from `GET /availability`; any other time returns `409 slot_unavailable`." }
        technician_id: { type: string, format: uuid, description: "The staff member (must perform the service at the location). Omit to have the first free one assigned (see the endpoint description)." }
        contact_id: { type: string, format: uuid, description: An existing contact. Provide this OR `contact`. }
        contact:
          $ref: "#/components/schemas/ContactCreate"
        notes: { type: string }

    GiftCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        code: { type: string }
        initial_balance_cents: { type: integer }
        current_balance_cents: { type: integer }
        currency: { type: string, example: "USD", description: "Uppercase ISO 4217 code of the currency every `_cents` field on this object is in (minor units, 2 decimals). Each location has its own currency, so check it rather than assuming USD; a Mexican location is MXN." }
        status: { type: string, enum: [active, partially_redeemed, redeemed, expired, voided], description: "`active` = full balance; `partially_redeemed` = some used; `redeemed` = balance 0; `expired` = past its expiry; `voided` = cancelled by the business (balance 0)." }
        created_at: { type: string, format: date-time }
        replaced_by_gift_card_id: { type: string, format: uuid, nullable: true, description: "Set when the business replaced this card (lost, damaged, or the customer needed a different card): its whole balance moved to the card with this id, so this card is `voided` at balance 0. The customer kept their money; it is on the new card." }
        replaces_gift_card_id: { type: string, format: uuid, nullable: true, description: "Set on a replacement card: the id of the card whose balance moved onto it. Nothing was sold." }

    Package:
      type: object
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        name: { type: string }
        price_cents: { type: integer }
        currency: { type: string, example: "USD", description: "Uppercase ISO 4217 code of the currency every `_cents` field on this object is in (minor units, 2 decimals). Each location has its own currency, so check it rather than assuming USD; a Mexican location is MXN." }
        total_sessions: { type: integer, nullable: true }

    MembershipPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        name: { type: string }
        price_cents: { type: integer }
        currency: { type: string, example: "USD", description: "Uppercase ISO 4217 code of the currency every `_cents` field on this object is in (minor units, 2 decimals). Each location has its own currency, so check it rather than assuming USD; a Mexican location is MXN." }
        billing_interval: { type: string, enum: [monthly, yearly] }

    ContactMembership:
      type: object
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        status: { type: string, enum: [trialing, active, past_due, paused, cancelled] }
        home_location_id: { type: string, format: uuid, nullable: true }
        credits_remaining: { type: integer, nullable: true, description: Null for unlimited plans. }
        period_credits_used: { type: integer }
        current_period_end: { type: string, format: date-time, nullable: true }
        next_renewal_date: { type: string, format: date, nullable: true }
        member_code: { type: string, nullable: true, description: The scannable member code. }

    MemberResolveResult:
      type: object
      properties:
        found: { type: boolean }
        membership_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        resolved_by: { type: string, nullable: true, enum: [code, fob] }
        valid_for_checkin: { type: boolean }
        reason:
          type: string
          description: >
            `eligible`, or why not: `memberships_not_enabled_at_location`, `membership_not_found`,
            `membership_not_active`, `plan_not_found`, `plan_not_facility_access`, `blackout_period`,
            `location_not_covered`, `home_location_only`, `contact_not_a_member`, `checkin_blocked`
            (see `block_reasons`), `no_credits_remaining`, `currency_mismatch` (the membership is in
            another currency than this location; see `message`), or `no_member_for_identifier`.
        message: { type: string, description: "A plain sentence to show a person, when the reason has one (currency_mismatch)." }
        block_reasons: { type: array, items: { type: string }, description: "With checkin_blocked: the location's check-in blocks that apply (e.g. past due, no card on file)." }
        plan_name: { type: string, nullable: true }
        status: { type: string, nullable: true }

    MemberVisit:
      type: object
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        check_in_method: { type: string }
        checked_in_at: { type: string, format: date-time }
        checked_out_at: { type: string, format: date-time, nullable: true }

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        event_types:
          type: array
          items: { type: string }
          description: 'Subscribed event types, or ["*"] for all.'
        description: { type: string, nullable: true }
        active: { type: boolean }
        all_locations: { type: boolean, description: True when the endpoint receives events from every location. }
        location_ids:
          type: array
          items: { type: string, format: uuid }
          description: When all_locations is false, the specific locations this endpoint is scoped to.
        created_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time, nullable: true, description: When a delivery to this endpoint last succeeded. }
        last_error: { type: string, nullable: true, description: The most recent delivery error, if any. }
        last_error_at: { type: string, format: date-time, nullable: true }

    WebhookEndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          properties:
            secret:
              type: string
              description: >
                The HMAC-SHA256 signing secret (whsec_...). Shown ONLY on create and
                on secret rotation. Store it securely; it is never returned again.

    WebhookDelivery:
      type: object
      description: One attempt record of sending an event to an endpoint.
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        event_id: { type: string, description: The event's stable id (matches the body's `id`, prefixed `evt_`). }
        status: { type: string, enum: [pending, delivered, failed, exhausted] }
        attempts: { type: integer }
        response_status: { type: integer, nullable: true, description: The last HTTP status your receiver returned. }
        delivered_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    WebhookEvent:
      type: object
      description: >
        The JSON body Booking Pro POSTs to your endpoint for every event. `data`
        always carries the booking / location / contact fields; payment events
        (`payment.received`, `payment.refunded`) add the payment fields below.
        Money is integer minor units (cents) of `data.currency`.
      properties:
        id: { type: string, example: "evt_6f1c2b9e-1d2a-4a51-9a33-0b8c1f7e2d10", description: "Stable event id (also sent as `X-BookingPro-Event-Id`). Use it to deduplicate." }
        type: { type: string, example: "payment.received", description: The event type. }
        created_at: { type: string, format: date-time }
        company_id: { type: string, format: uuid }
        data:
          type: object
          properties:
            booking_id: { type: string, format: uuid, nullable: true }
            location_id: { type: string, format: uuid, nullable: true }
            technician_id: { type: string, format: uuid, nullable: true }
            starts_at: { type: string, format: date-time, nullable: true }
            status: { type: string, nullable: true, description: "The booking status as the business names it (present when the event carries one)." }
            previous_starts_at: { type: string, format: date-time, nullable: true, description: "`booking.rescheduled` only." }
            previous_technician_id: { type: string, format: uuid, nullable: true, description: "`booking.rescheduled` only." }
            contact:
              type: object
              description: Contact-match fields, so you can find the same person in your own system.
              properties:
                contact_id: { type: string, format: uuid, nullable: true }
                phone: { type: string, nullable: true, description: E.164 phone (+ and country code). }
                email: { type: string, nullable: true }
                name: { type: string, nullable: true }
            payment_id: { type: string, format: uuid, nullable: true, description: "Payment events only." }
            order_id: { type: string, format: uuid, nullable: true, description: "Payment events only." }
            amount_cents: { type: integer, nullable: true, description: "Payment events only. The amount in minor units (cents) of `currency`." }
            tip_cents: { type: integer, description: "Payment events only. The tip in minor units (cents) of `currency`." }
            currency: { type: string, example: "USD", description: "Payment events only. Uppercase ISO 4217 code of `amount_cents` and `tip_cents`: the order's currency, else the location's. Never assume USD; a Mexican location is MXN." }
            method: { type: string, nullable: true, description: "Payment events only. How it was paid (card, cash, ...)." }
