        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages:
    get:
      operationId: listPackages
      tags: [Packages]
      summary: List package templates
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
